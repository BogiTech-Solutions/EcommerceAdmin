name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ----------------------------------------------------
  # 1. CI Phase: Quality checks and testing
  # ----------------------------------------------------
  quality-and-test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Linter
        run: bun run lint

      - name: Check Formatting
        run: bunx prettier --check "**/*.{js,jsx,ts,tsx,json,css,md}"

      - name: Type Check (TypeScript)
        run: bun run tsc --noEmit
        continue-on-error: false

      # - name: Run Unit Tests
      #   run: bun test
      #   if: always() # Optional: Run tests even if previous step fails if configured

  # ----------------------------------------------------
  # 2. CD Phase: Deploy to Vercel (Only on main branch)
  # ----------------------------------------------------
  deploy:
    name: Deploy to Production
    needs: quality-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: bun add -g vercel

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}