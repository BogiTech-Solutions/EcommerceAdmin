name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ----------------------------------------------------
  # 1. CI Phase: Quality checks and testing
  # ----------------------------------------------------
  quality-and-test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Remove cached/stale .vercel directory before pulling
      - name: Clean stale Vercel state
        run: rm -rf .vercel

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Linter
        run: bun run lint

      - name: Check Formatting
        run: bunx prettier --check "**/*.{js,jsx,ts,tsx,json,css,md}"

      - name: Type Check (TypeScript)
        run: bun run tsc --noEmit
        continue-on-error: false

      # - name: Run Unit Tests
      #   run: bun test

  # ----------------------------------------------------
  # 2. CD Phase: Deploy to Vercel (Only on main/master)
  # ----------------------------------------------------
  deploy:
    name: Deploy to Production
    needs: quality-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Step 1: Force remove any cached or stale .vercel directory
      - name: Remove stale Vercel cache
        run: rm -rf .vercel
      # -------------------------------------------------------------
      # ADD THIS STEP HERE TO REMOVE THE .vercel FOLDER IN GITHUB ACTIONS
      # -------------------------------------------------------------
      - name: Delete .vercel directory
        run: rm -rf .vercel
      # Step 2: Pull production environment passing token explicitly
      - name: Pull Vercel Environment Information
        run: bunx vercel pull --yes --environment=production

      # Step 3: Build artifacts
      - name: Build Project Artifacts
        run: bunx vercel build --prod

      # Step 4: Deploy prebuilt artifacts
      - name: Deploy Project Artifacts to Vercel
        run: bunx vercel deploy --prebuilt --prod
